<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColorTxt 阅读</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="sidebarTab" onclick="toggleSidebar()">&#9654;</div>
<div id="sidebar">
  <div id="sidebarPanel">
    <h3>章节</h3>
    <div id="chapterList"></div>
  </div>
</div>
<div id="stickyChapter"></div>
<div id="main">
<div class="toolbar">
  <select id="fileSelect" onchange="onFileChange()">
    <option value="">-- 选择文件 --</option>
  </select>
  <button id="btnRefresh" onclick="loadFile(currentFile, true)">刷新</button>
  <button id="btnFontMinus" onclick="changeFontSize(-1)">A−</button>
  <button id="btnFontPlus" onclick="changeFontSize(1)">A+</button>
</div>
<div id="content"><div id="status">请选择文件</div></div>
</div>
<script src="/app.js"></script>
</body>
</html>
